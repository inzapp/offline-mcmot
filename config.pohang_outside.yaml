# GAMFF 운영보고서 5번 슬라이드 기준 근사 구역. 진입객은 외부 gate에서
# 그늘 gate로 향하는 방향만 인정한다. 우드부스 시선은 그늘 안 사람의 OOI ray가
# 해당 우드부스 polygon과 교차할 때 기록한다.
spatial:
  routes:
    - name: "진입객1"
      bidirectional: false
      start_gate: [[0.76, 0.16], [0.86, 0.16], [0.86, 0.29], [0.76, 0.29]]
      end_gate: [[0.67, 0.28], [0.82, 0.28], [0.82, 0.48], [0.67, 0.48]]
    - name: "진입객2"
      bidirectional: false
      start_gate: [[0.20, 0.16], [0.31, 0.16], [0.31, 0.29], [0.20, 0.29]]
      end_gate: [[0.27, 0.28], [0.39, 0.28], [0.39, 0.48], [0.27, 0.48]]
    - name: "진입객3"
      bidirectional: false
      start_gate: [[0.00, 0.84], [0.28, 0.84], [0.28, 1.00], [0.00, 1.00]]
      end_gate: [[0.27, 0.62], [0.39, 0.62], [0.39, 0.86], [0.27, 0.86]]
  regions:
    - {name: "그늘1", polygon: [[0.67, 0.16], [0.82, 0.16], [0.82, 0.82], [0.67, 0.82]]}
    - {name: "그늘2", polygon: [[0.27, 0.16], [0.39, 0.16], [0.39, 0.82], [0.27, 0.82]]}
    - {name: "우드부스1", polygon: [[0.81, 0.16], [0.88, 0.16], [0.88, 0.82], [0.81, 0.82]]}
    - {name: "우드부스2", polygon: [[0.19, 0.16], [0.27, 0.16], [0.27, 0.82], [0.19, 0.82]]}
  gaze:
    keypoint_confidence: 0.3
    targets:
      - name: "우드부스 시선1"
        source_polygon: [[0.67, 0.16], [0.82, 0.16], [0.82, 0.82], [0.67, 0.82]]
        target_polygon: [[0.81, 0.16], [0.88, 0.16], [0.88, 0.82], [0.81, 0.82]]
      - name: "우드부스 시선2"
        source_polygon: [[0.27, 0.16], [0.39, 0.16], [0.39, 0.82], [0.27, 0.82]]
        target_polygon: [[0.19, 0.16], [0.27, 0.16], [0.27, 0.82], [0.19, 0.82]]
